name: CI

on:
  push:
    paths:
      - "src/test/**"
      - "src/main/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "gradle/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "24"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run src/test
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon
