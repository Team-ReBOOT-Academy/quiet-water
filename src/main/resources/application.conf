ktor {
    deployment {
        port = 8888
        host = "0.0.0.0"
    }
}

quiet-water {
    service {
        name = "quiet-water"
        version = "1.0.0"
    }

    identity {
        student-id = "llnightll"
        strategy-id = "quiet-water"
        display-name = "Quiet Water"
        study-group = ""
    }

    events {
        schema-version = "1.0"
        registration-request = "account.registration.request"
        registration-accepted = "account.registration.accepted"
        registration-rejected = "account.registration.rejected"
        candle-closed = "market.candle.closed"
        recommendation-created = "strategy.recommendation.created"
    }

    registration {
        rejected-without-reason = "registration was rejected without a reason"
        pending-reason = "registration is not accepted yet"
    }

    kafka {
        group-id = "quiet-water-llnightll"
        security-protocol = "SASL_SSL"
        sasl-mechanism = "SCRAM-SHA-256"
        registration-topic = "account.registration.request"
        auto-offset-reset = "earliest"
        poll-millis = 1000
        reconnect-initial-millis = 1000
        reconnect-max-millis = 30000
        send-timeout-millis = 10000
        close-millis = 5000
        dedup-capacity = 10000
        unconfigured-details = "broker is not configured"
        unavailable-details = "broker is temporarily unavailable"
        up-details = "broker connection is up"
    }

    recommendation {
        signal = "HOLD"
        confidence = 0.0
        suggested-quantity = 0
        data-quality = "OK"
        reason = "базовая рекомендация HOLD, торговый сигнал ещё не публикуется"
    }

    strategy {
        n = 90
        k = 45
        m = 10
        w = 20
        t = 0.55
        rsi-period = 14
        rsi-oversold = 30
        rsi-overbought = 70
    }

    shutdown {
        grace-millis = 1000
        timeout-millis = 5000
    }
}
