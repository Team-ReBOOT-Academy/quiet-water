ktor {
    deployment {
        port = 8888
        host = "0.0.0.0"
    }
}

quiet-water {
    service {
        name = "quiet-water"
        version = "1.0.0"
    }

    kafka {
        unconfigured-details = "broker is not configured"
        configured-details = "broker settings are present"
    }

    strategy {
        n = 90
        k = 45
        m = 10
        w = 20
        t = 0.55
        rsi-period = 14
        rsi-oversold = 30
        rsi-overbought = 70
    }

    shutdown {
        grace-millis = 1000
        timeout-millis = 5000
    }
}
